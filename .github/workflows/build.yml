name: Release

on:
  push:
    tags:
      - 'v*' # 打 tag 如 v1.0.0 时触发
  workflow_dispatch: # 也支持手动触发

# 授权：创建 Release 需要 contents: write 权限
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64（Apple Silicon）
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: wb-proxy
          # macOS x86_64（Intel）
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: wb-proxy
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: wb-proxy.exe
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: wb-proxy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macOS 上交叉编译 x86_64 需要额外目标（默认只有本机架构）
      - name: Add macOS x86_64 target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 打包成 zip（附带 .env.example 和 README，方便用户直接使用）
      # 注意: Windows 用 PowerShell 原生压缩（bash 会把 Windows 路径反斜杠吃掉）
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" dist\
          Copy-Item .env.example dist\
          Copy-Item README.md dist\
          Compress-Archive -Path "dist\*" -DestinationPath "dist\wb-proxy-${{ matrix.target }}.zip" -Force

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp .env.example dist/
          cp README.md dist/
          cd dist
          zip -r wb-proxy-${{ matrix.target }}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb-proxy-${{ matrix.target }}
          path: dist/wb-proxy-${{ matrix.target }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: false
          prerelease: false

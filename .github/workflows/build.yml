name: Release

on:
  push:
    tags:
      - 'v*' # 打 tag 如 v1.0.0 时触发
  workflow_dispatch: # 也支持手动触发

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64（Apple Silicon）
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: wb-proxy
          # macOS x86_64（Intel）
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: wb-proxy
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: wb-proxy.exe
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: wb-proxy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # macOS 上交叉编译 x86_64 需要额外目标（默认只有本机架构）
      - name: Add macOS x86_64 target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # 打包成 zip（附带 .env.example 和 README，方便用户直接使用）
      - name: Package
        shell: bash
        run: |
          cd ${{ github.workspace }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp .env.example dist/
          cp README.md dist/
          cd dist
          if [ "${{ runner.os }}" == "Windows" ]; then
            powershell Compress-Archive -Path * -DestinationPath wb-proxy-${{ matrix.target }}.zip
          else
            zip -r wb-proxy-${{ matrix.target }}.zip *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb-proxy-${{ matrix.target }}
          path: dist/wb-proxy-${{ matrix.target }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false

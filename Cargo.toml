[package]
name = "workbuddy-proxy-rust"
version = "1.0.0"
edition = "2021"
description = "WorkBuddy → OpenAI-compatible reverse proxy (Rust)"
license = "MIT"

[[bin]]
name = "wb-proxy"
path = "src/main.rs"

[lib]
name = "workbuddy_proxy_rust"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["http2", "rustls-tls", "json", "stream", "gzip"] }
tokio-tungstenite = "0.24"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
url = "2"
base64 = "0.22"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
